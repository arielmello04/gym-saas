spring:
  application:
    name: gym-system
  datasource:
    url: jdbc:postgresql://localhost:5432/gymsystem
    username: gymsystem
    password: gymsystem
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Preenchido apenas quando notifications.email.provider=smtp
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

# ─── Security ────────────────────────────────────────────────
security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
    expiration-seconds: 86400   # 24h

# ─── CORS ────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

# ─── Payments ────────────────────────────────────────────────
# Troque "mock" por "mercadopago", "pagarme" ou "stripe" quando pronto
payments:
  gateway: ${PAYMENT_GATEWAY:mock}

  # Mercado Pago (ativo quando payments.gateway=mercadopago)
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}

  # Pagar.me v5 (ativo quando payments.gateway=pagarme)
  pagarme:
    secret-key: ${PAGARME_SECRET_KEY:}
    webhook-secret: ${PAGARME_WEBHOOK_SECRET:}

  # Stripe (ativo quando payments.gateway=stripe)
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  past-due:
    cancel-future-bookings: true
    grace-hours: 0

  max-attempts: 3
  retry-backoff-minutes: 60

  scheduler:
    cron: "0 * * * * *"   # a cada minuto

# ─── Notificações ────────────────────────────────────────────
# Opções: console (dev) | smtp | sendgrid
notifications:
  email:
    provider: ${EMAIL_PROVIDER:console}
    from: ${EMAIL_FROM:noreply@gymsystem.com.br}
    from-name: ${EMAIL_FROM_NAME:GymSystem}

  # SendGrid (ativo quando notifications.email.provider=sendgrid)
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}

# ─── Check-in ────────────────────────────────────────────────
checkin:
  # Segredo do callback assincrono do provedor (header X-Provider-Secret).
  callback-secret: ${CHECKIN_SECRET:change-me}

  # Parceiros de check-in. Uma academia costuma estar nos dois ao mesmo tempo,
  # entao ambos ficam ativos e a escolha e por requisicao.
  #
  # mode=mock: valida sem chamar o parceiro (qualquer codigo passa; codigo
  # comecando por DENY e recusado). Serve para desenvolver e testar o fluxo
  # inteiro antes de ter credencial. mode=live: chama a API de verdade.
  partners:
    # Segredo embutido na URL de webhook. A TotalPass nao assina a chamada,
    # entao e ele que impede alguem de criar entradas conhecendo a URL.
    webhook-secret: ${CHECKIN_WEBHOOK_SECRET:change-me}

    # Fecha os check-ins recebidos que passaram do prazo do parceiro.
    expiry-check-ms: 300000

    # Wellhub — Access Control API. O aluno faz check-in no app e a academia
    # valida enviando o gympass_id dele. Token estatico entregue pelo Wellhub.
    # Sandbox: https://apitesting.partners.gympass.com/access/v1
    wellhub:
      mode:     ${WELLHUB_MODE:mock}
      base-url: ${WELLHUB_BASE_URL:https://api.partners.gympass.com/access/v1}
      token:    ${WELLHUB_TOKEN:}
      gym-id:   ${WELLHUB_GYM_ID:}

    # TotalPass — quem chama e o parceiro. Autenticamos a unidade, registramos
    # a URL de webhook, e confirmamos a entrada no link que vem no payload.
    totalpass:
      mode:             ${TOTALPASS_MODE:mock}
      auth-url:         ${TOTALPASS_AUTH_URL:https://booking-api.totalpass.com/partner/auth}
      webhook-base-url: ${TOTALPASS_WEBHOOK_URL:https://booking-api.totalpass.com/partner/webhook}
      partner-api-key:  ${TOTALPASS_PARTNER_API_KEY:}
      place-api-key:    ${TOTALPASS_PLACE_API_KEY:}

# ─── Rate Limit ──────────────────────────────────────────────
ratelimit:
  bookings:
    book-min-interval-ms: 800
    cancel-min-interval-ms: 800

# ─── Waitlist ────────────────────────────────────────────────
waitlist:
  expiry-check-ms: 300000   # verifica expiração a cada 5 minutos

# ─── App ─────────────────────────────────────────────────────
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

# ─── Async ───────────────────────────────────────────────────
spring.task.execution:
  pool:
    core-size: 4
    max-size: 16
    queue-capacity: 100
  thread-name-prefix: gymsystem-async-

# ─── Actuator ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # O starter-mail registra um health check que abre conexao com o SMTP. Com
    # notifications.email.provider=console (o padrao) nao ha SMTP configurado,
    # entao esse check falhava e derrubava o /actuator/health inteiro para DOWN -
    # o que reprova qualquer readiness probe. Ligue de volta junto com o SMTP.
    mail:
      enabled: false
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    org.springframework.security: INFO
    org.springdoc: INFO
    org.springframework.web: INFO
