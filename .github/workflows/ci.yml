name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: gym-api (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # O wrapper perde o bit de execução ao vir do Windows.
      - name: Permitir execução do wrapper
        run: chmod +x ./mvnw

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Publicar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: gym-api/target/surefire-reports/
          if-no-files-found: ignore

  web:
    name: gym-angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gym-angular/package-lock.json

      - name: Instalar dependências
        working-directory: gym-angular
        run: npm ci

      - name: Build de produção
        working-directory: gym-angular
        run: npm run build:prod
